name: Phantom v8.0 Release Build (from ZIP)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s PHANTOM-v8.0-SOURCE.zip || { echo 'PHANTOM-v8.0-SOURCE.zip is missing from repository root'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q PHANTOM-v8.0-SOURCE.zip -d "$GITHUB_WORKSPACE/source"
          SRC_DIR="$GITHUB_WORKSPACE/source/PHANTOM-FINAL-SOURCE"
          test -d "$SRC_DIR/V2rayNG"
          test -s "$SRC_DIR/V2rayNG/app/src/main/assets/phantom-worker.js"
          test -s "$SRC_DIR/compile-hevtun.sh"
          echo "PHANTOM_SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Setup Node for Worker release build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Minify and validate Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR/V2rayNG"
          mkdir -p app/src/release/assets
          npx --yes terser@5.51.2 app/src/main/assets/phantom-worker.js \
            --module --compress passes=2 --mangle --format comments=false \
            --output app/src/release/assets/phantom-worker.js
          test -s app/src/release/assets/phantom-worker.js
          cp app/src/release/assets/phantom-worker.js "$RUNNER_TEMP/phantom-worker.mjs"
          node --check "$RUNNER_TEMP/phantom-worker.mjs"
          python3 - app/src/release/assets/phantom-worker.js <<'PYCODE'
          import pathlib, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          required = ["/panel", "/health", "/api/state", "/api/users", "/api/settings", "/sub/", "/stream/", "cloudflare:sockets"]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Worker release validation failed; missing markers: " + ", ".join(missing))
          print(f"Worker release validated: {len(source)} bytes")
          PYCODE

      - name: Setup Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_REV="15859902"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/commandlinetools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_REV}_latest.zip"
          rm -rf "$SDK_ROOT/cmdline-tools/latest" "$SDK_ROOT/cmdline-tools/cmdline-tools"
          unzip -q /tmp/commandlinetools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # Android API 37 is published as platforms;android-37.0.
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "ndk;30.0.16248370"
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            echo "Android 37 platform was not installed. Installed platforms:"
            ls -la "$SDK_ROOT/platforms" || true
            exit 1
          fi
          test -d "$SDK_ROOT/ndk/30.0.16248370"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Fetch pinned HEV JNI source and dependencies
        env:
          HEV_COMMIT: 64cc609f945253b0e9ebc56317d544268f3c68c1
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR"
          rm -rf hev-socks5-tunnel
          git clone --filter=blob:none https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
          git -C hev-socks5-tunnel fetch --depth=1 origin "$HEV_COMMIT"
          git -C hev-socks5-tunnel checkout --detach FETCH_HEAD
          git -C hev-socks5-tunnel submodule update --init --recursive
          test -f hev-socks5-tunnel/Android.mk
          test -f hev-socks5-tunnel/src/hev-jni.c
          test -f hev-socks5-tunnel/third-part/yaml/Android.mk

      - name: Compile HEV libraries for armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR"
          ABIS=armeabi-v7a bash compile-hevtun.sh
          test -s "libs/armeabi-v7a/libhev-socks5-tunnel.so"
          test -s "libs/armeabi-v7a/libhevsockstun.so"
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/

      - name: Download matching Xray AAR
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: 'v26.9.9'
          fileName: 'libv2ray.aar'
          out-file-path: 'source/PHANTOM-FINAL-SOURCE/V2rayNG/app/libs/'

      - name: Verify Xray AAR contains armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail
          AAR="$PHANTOM_SRC_DIR/V2rayNG/app/libs/libv2ray.aar"
          test -s "$AAR"
          unzip -Z1 "$AAR" | grep -E '^jni/armeabi-v7a/[^/]+\.so$'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release keystore
        shell: bash
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/signing-out"
          KS="$GITHUB_WORKSPACE/signing-out/phantom.jks"
          if [ -n "${APP_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$APP_KEYSTORE_BASE64" | base64 -d > "$KS"
            test -n "${APP_KEYSTORE_PASSWORD:-}" && test -n "${APP_KEYSTORE_ALIAS:-}" && test -n "${APP_KEY_PASSWORD:-}"
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$APP_KEYSTORE_PASSWORD" "$APP_KEYSTORE_ALIAS" "$APP_KEY_PASSWORD" \
              > "$GITHUB_WORKSPACE/signing-out/keystore.props"
            echo "EPHEMERAL_KEYSTORE=false" >> "$GITHUB_ENV"
          else
            STORE_PASS="$(openssl rand -base64 18 | tr -d '\n')"
            keytool -genkeypair -keystore "$KS" -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
              -alias phantom -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Phantom, OU=Android, O=Phantom, L=NA, ST=NA, C=US"
            printf 'storePassword=%s\nkeyAlias=phantom\nkeyPassword=%s\n' \
              "$STORE_PASS" "$STORE_PASS" > "$GITHUB_WORKSPACE/signing-out/keystore.props"
            echo "EPHEMERAL_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "WARNING: a temporary signing key was generated. Keep its artifact private; later updates require the same key."
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build Phantom armeabi-v7a release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR/V2rayNG"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          PROPS="$GITHUB_WORKSPACE/signing-out/keystore.props"
          STORE_PASS="$(sed -n 's/^storePassword=//p' "$PROPS")"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$PROPS")"
          KEY_PASS="$(sed -n 's/^keyPassword=//p' "$PROPS")"
          ./gradlew --no-daemon :app:assemblePlaystoreRelease -PABI_FILTERS=armeabi-v7a \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify APK libraries, embedded Worker and R8 obfuscation
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PHANTOM_SRC_DIR/V2rayNG/app/build/outputs/apk/playstore/release" -maxdepth 1 -type f -name '*armeabi-v7a*.apk' | head -n 1)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libhev-socks5-tunnel.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libhevsockstun.so'
          AAR="$PHANTOM_SRC_DIR/V2rayNG/app/libs/libv2ray.aar"
          while IFS= read -r aar_lib; do
            apk_lib="lib/${aar_lib#jni/}"
            unzip -Z1 "$APK" | grep -Fx "$apk_lib"
          done < <(unzip -Z1 "$AAR" | grep -E '^jni/armeabi-v7a/[^/]+\.so$')
          unzip -p "$APK" assets/phantom-worker.js > "$RUNNER_TEMP/apk-worker.mjs"
          test -s "$RUNNER_TEMP/apk-worker.mjs"
          node --check "$RUNNER_TEMP/apk-worker.mjs"
          python3 - "$RUNNER_TEMP/apk-worker.mjs" <<'PYCODE'
          import pathlib, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          required = ["/panel", "/health", "/api/state", "/api/users", "/api/settings", "/sub/", "/stream/", "cloudflare:sockets"]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Embedded Worker missing expected capabilities: " + ", ".join(missing))
          print(f"Embedded Worker verified: {len(source)} bytes")
          PYCODE
          MAP="$PHANTOM_SRC_DIR/V2rayNG/app/build/outputs/mapping/playstoreRelease/mapping.txt"
          test -s "$MAP"
          python3 - "$MAP" <<'PYCODE'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          renamed = [line for line in text if line.startswith("com.v2ray.ang.handler.MmkvManager -> ")]
          if not renamed:
              sys.exit("R8 mapping has no MmkvManager entry; minify did not run")
          target = renamed[0].split("->", 1)[1].strip().rstrip(":")
          if target == "com.v2ray.ang.handler.MmkvManager":
              sys.exit("MmkvManager was not renamed; release obfuscation is not active")
          print("R8 renamed MmkvManager ->", target)
          PYCODE
          echo "Verified APK: $APK"

      - name: Upload Phantom APK
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-2.4.3-Android-armeabi-v7a-Release-APK
          path: source/PHANTOM-FINAL-SOURCE/V2rayNG/app/build/outputs/apk/playstore/release/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping (keep private)
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-R8-mapping-KEEP-PRIVATE
          path: source/PHANTOM-FINAL-SOURCE/V2rayNG/app/build/outputs/mapping/playstoreRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated keystore (keep private)
        if: env.EPHEMERAL_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-signing-keystore-KEEP-PRIVATE
          path: signing-out/*
          if-no-files-found: error
          retention-days: 14
