name: Phantom ZEUS-Architecture Debug Build (from ZIP)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s PHANTOM-ZEUS-ARCH-SOURCE.zip || { echo 'PHANTOM-ZEUS-ARCH-SOURCE.zip is missing from repository root'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q PHANTOM-ZEUS-ARCH-SOURCE.zip -d "$GITHUB_WORKSPACE/source"
          SRC_DIR="$GITHUB_WORKSPACE/source/PHANTOM-FINAL-SOURCE"
          test -d "$SRC_DIR/V2rayNG"
          test -s "$SRC_DIR/V2rayNG/app/src/main/assets/phantom-worker.js"
          test -s "$SRC_DIR/compile-hevtun.sh"
          echo "PHANTOM_SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Setup Node for Worker release build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Obfuscate and validate Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR/V2rayNG"
          SOURCE="app/src/main/assets/phantom-worker.js"
          OUTPUT="app/src/release/assets/phantom-worker.js"
          mkdir -p app/src/release/assets
          python3 - "$SOURCE" <<'PYCODE'
          import pathlib, re, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          required = ["/panel", "/health", "/api/state", "/api/users", "/api/settings", "/sub/", "/stream/", "cloudflare:sockets", "const Router", "const DbService", "const AuthService"]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Worker source validation failed: " + ", ".join(missing))
          if re.search(r"[\u0600-\u06ff]", source):
              raise SystemExit("Worker source contains non-English UI/source text")
          print(f"Worker source validated: {len(source)} bytes")
          PYCODE
          npx --yes terser@5.51.2 "$SOURCE" \
            --module --compress passes=2 --mangle --format comments=false \
            --output "$RUNNER_TEMP/phantom-worker.min.mjs"
          npx --yes javascript-obfuscator@5.10.1 "$RUNNER_TEMP/phantom-worker.min.mjs" \
            --output "$OUTPUT" \
            --target browser-no-eval \
            --compact true \
            --string-array true \
            --string-array-encoding base64 \
            --ignore-imports true \
            --string-array-threshold 0.45 \
            --identifier-names-generator hexadecimal \
            --control-flow-flattening false \
            --dead-code-injection false \
            --rename-globals false \
            --rename-properties false \
            --self-defending false \
            --debug-protection false \
            --unicode-escape-sequence false
          test -s "$OUTPUT"
          cp "$OUTPUT" "$RUNNER_TEMP/phantom-worker.mjs"
          node --check "$RUNNER_TEMP/phantom-worker.mjs"
          python3 - "$OUTPUT" <<'PYCODE'
          import pathlib, re, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          if re.search(r"[\u0600-\u06ff]", source):
              raise SystemExit("Obfuscated Worker contains non-English text")
          if re.search(r"\bnew\s+Function\s*\(|\beval\s*\(", source):
              raise SystemExit("Dynamic code execution found in Worker output")
          if "cloudflare:sockets" not in source or "export default" not in source:
              raise SystemExit("Obfuscated module lost its Cloudflare entrypoint/import")
          print(f"Obfuscated Worker validated: {len(source)} bytes")
          PYCODE
          PHANTOM_WORKER_SOURCE="$OUTPUT" node "$PHANTOM_SRC_DIR/tests/worker-smoke.mjs"

      - name: Setup Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_REV="15859902"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/commandlinetools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_REV}_latest.zip"
          rm -rf "$SDK_ROOT/cmdline-tools/latest" "$SDK_ROOT/cmdline-tools/cmdline-tools"
          unzip -q /tmp/commandlinetools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # Android API 37 is published as platforms;android-37.0.
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "ndk;30.0.16248370"
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            echo "Android 37 platform was not installed. Installed platforms:"
            ls -la "$SDK_ROOT/platforms" || true
            exit 1
          fi
          test -d "$SDK_ROOT/ndk/30.0.16248370"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Fetch pinned HEV JNI source and dependencies
        env:
          HEV_COMMIT: 64cc609f945253b0e9ebc56317d544268f3c68c1
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR"
          rm -rf hev-socks5-tunnel
          git clone --filter=blob:none https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
          git -C hev-socks5-tunnel fetch --depth=1 origin "$HEV_COMMIT"
          git -C hev-socks5-tunnel checkout --detach FETCH_HEAD
          git -C hev-socks5-tunnel submodule update --init --recursive
          test -f hev-socks5-tunnel/Android.mk
          test -f hev-socks5-tunnel/src/hev-jni.c
          test -f hev-socks5-tunnel/third-part/yaml/Android.mk

      - name: Compile HEV libraries for armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR"
          ABIS=armeabi-v7a bash compile-hevtun.sh
          test -s "libs/armeabi-v7a/libhev-socks5-tunnel.so"
          test -s "libs/armeabi-v7a/libhevsockstun.so"
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/

      - name: Download matching Xray AAR
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: 'v26.9.9'
          fileName: 'libv2ray.aar'
          out-file-path: 'source/PHANTOM-FINAL-SOURCE/V2rayNG/app/libs/'

      - name: Verify Xray AAR contains armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail
          AAR="$PHANTOM_SRC_DIR/V2rayNG/app/libs/libv2ray.aar"
          test -s "$AAR"
          unzip -Z1 "$AAR" | grep -E '^jni/armeabi-v7a/[^/]+\.so$'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Phantom armeabi-v7a debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR/V2rayNG"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :app:assemblePlaystoreDebug -PABI_FILTERS=armeabi-v7a

      - name: Verify APK libraries and embedded Worker
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PHANTOM_SRC_DIR/V2rayNG/app/build/outputs/apk/playstore/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libhev-socks5-tunnel.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libhevsockstun.so'
          AAR="$PHANTOM_SRC_DIR/V2rayNG/app/libs/libv2ray.aar"
          while IFS= read -r aar_lib; do
            apk_lib="lib/${aar_lib#jni/}"
            unzip -Z1 "$APK" | grep -Fx "$apk_lib"
          done < <(unzip -Z1 "$AAR" | grep -E '^jni/armeabi-v7a/[^/]+\.so$')
          unzip -p "$APK" assets/phantom-worker.js > "$RUNNER_TEMP/apk-worker.mjs"
          test -s "$RUNNER_TEMP/apk-worker.mjs"
          node --check "$RUNNER_TEMP/apk-worker.mjs"
          python3 - "$RUNNER_TEMP/apk-worker.mjs" <<'PYCODE'
          import pathlib, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          required = ["/panel", "/health", "/api/state", "/api/users", "/api/settings", "/sub/", "/stream/", "cloudflare:sockets"]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Embedded Worker missing expected capabilities: " + ", ".join(missing))
          print(f"Embedded Worker verified: {len(source)} bytes")
          PYCODE
          echo "Verified debug APK: $APK"

      - name: Upload Phantom Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-Debug-APK-armeabi-v7a
          path: source/PHANTOM-FINAL-SOURCE/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
          retention-days: 14
