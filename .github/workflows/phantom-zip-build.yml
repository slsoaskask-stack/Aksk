name: Phantom ZEUS-Architecture Release Build (debug-signed, no keystore secrets)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Phantom source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/PHANTOM-ZEUS-ARCH-SOURCE.zip"
          if [ ! -s "$ZIP_PATH" ]; then
            echo "ERROR: PHANTOM-ZEUS-ARCH-SOURCE.zip must be uploaded to the repository root."
            echo "ZIP files found in the repository:"
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print || true
            echo "Repository root contents:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          unzip -tq "$ZIP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/source"
          SRC_DIR="$GITHUB_WORKSPACE/source/PHANTOM-FINAL-SOURCE"
          test -d "$SRC_DIR/V2rayNG" || { echo "Invalid source ZIP: PHANTOM-FINAL-SOURCE/V2rayNG not found"; exit 1; }
          test -s "$SRC_DIR/V2rayNG/app/src/main/assets/phantom-worker.js" || { echo "Source ZIP is missing the canonical Worker asset"; exit 1; }
          test -s "$SRC_DIR/compile-hevtun.sh" || { echo "Source ZIP is missing compile-hevtun.sh"; exit 1; }
          test -s "$SRC_DIR/tests/worker-smoke.mjs" || { echo "Source ZIP is missing the Worker smoke tests"; exit 1; }
          echo "Using source directory: $SRC_DIR"
          echo "PHANTOM_SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Setup Node for Worker validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the canonical obfuscated Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PHANTOM_SRC_DIR/V2rayNG/app/src/main/assets/phantom-worker.js"
          test -s "$SOURCE"
          cp "$SOURCE" "$RUNNER_TEMP/phantom-worker.mjs"
          node --check "$RUNNER_TEMP/phantom-worker.mjs"
          python3 - "$SOURCE" <<'PYCODE'
          import pathlib, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          required = ("cloudflare:sockets", "export default")
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Worker module is missing required Cloudflare markers: " + ", ".join(missing))
          print(f"Worker syntax and module markers verified ({len(source)} characters).")
          PYCODE
          PHANTOM_WORKER_SOURCE="$SOURCE" node "$PHANTOM_SRC_DIR/tests/worker-smoke.mjs"

      - name: Setup Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_REV="15859902"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/commandlinetools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_REV}_latest.zip"
          rm -rf "$SDK_ROOT/cmdline-tools/latest" "$SDK_ROOT/cmdline-tools/cmdline-tools"
          unzip -q /tmp/commandlinetools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "ndk;30.0.16248370"
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            echo "Android 37 platform was not installed. Installed platforms:"
            ls -la "$SDK_ROOT/platforms" || true
            exit 1
          fi
          test -d "$SDK_ROOT/ndk/30.0.16248370"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Fetch pinned HEV JNI source and dependencies
        env:
          HEV_COMMIT: 64cc609f945253b0e9ebc56317d544268f3c68c1
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR"
          rm -rf hev-socks5-tunnel
          git clone --filter=blob:none https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
          git -C hev-socks5-tunnel fetch --depth=1 origin "$HEV_COMMIT"
          git -C hev-socks5-tunnel checkout --detach FETCH_HEAD
          git -C hev-socks5-tunnel submodule update --init --recursive
          test -f hev-socks5-tunnel/Android.mk
          test -f hev-socks5-tunnel/src/hev-jni.c
          test -f hev-socks5-tunnel/third-part/yaml/Android.mk

      - name: Compile HEV libraries for armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR"
          ABIS=armeabi-v7a bash compile-hevtun.sh
          test -s "libs/armeabi-v7a/libhev-socks5-tunnel.so"
          test -s "libs/armeabi-v7a/libhevsockstun.so"
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/

      - name: Download matching Xray AAR
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: 'v26.9.9'
          fileName: 'libv2ray.aar'
          out-file-path: 'source/PHANTOM-FINAL-SOURCE/V2rayNG/app/libs/'

      - name: Verify Xray AAR contains armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail
          AAR="$PHANTOM_SRC_DIR/V2rayNG/app/libs/libv2ray.aar"
          test -s "$AAR"
          unzip -Z1 "$AAR" | grep -E '^jni/armeabi-v7a/[^/]+\.so$'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Phantom armeabi-v7a release APK (debug certificate; no secrets)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PHANTOM_SRC_DIR/V2rayNG"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :app:assemblePlaystoreRelease -PABI_FILTERS=armeabi-v7a

      - name: Verify APK libraries, embedded Worker and R8 obfuscation
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PHANTOM_SRC_DIR/V2rayNG/app/build/outputs/apk/playstore/release" -maxdepth 1 -type f -name '*armeabi-v7a*.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libhev-socks5-tunnel.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libhevsockstun.so'
          AAR="$PHANTOM_SRC_DIR/V2rayNG/app/libs/libv2ray.aar"
          while IFS= read -r aar_lib; do
            apk_lib="lib/${aar_lib#jni/}"
            unzip -Z1 "$APK" | grep -Fx "$apk_lib"
          done < <(unzip -Z1 "$AAR" | grep -E '^jni/armeabi-v7a/[^/]+\.so$')
          unzip -p "$APK" assets/phantom-worker.js > "$RUNNER_TEMP/apk-worker.mjs"
          test -s "$RUNNER_TEMP/apk-worker.mjs"
          node --check "$RUNNER_TEMP/apk-worker.mjs"
          PHANTOM_WORKER_SOURCE="$RUNNER_TEMP/apk-worker.mjs" node "$PHANTOM_SRC_DIR/tests/worker-smoke.mjs"
          echo "Embedded Worker smoke tests passed"
          MAP="$PHANTOM_SRC_DIR/V2rayNG/app/build/outputs/mapping/playstoreRelease/mapping.txt"
          test -s "$MAP"
          python3 - "$MAP" <<'PYCODE'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          renamed = [line for line in text if line.startswith("com.v2ray.ang.handler.MmkvManager -> ")]
          if not renamed:
              sys.exit("R8 mapping has no MmkvManager entry; minify did not run")
          target = renamed[0].split("->", 1)[1].strip().rstrip(":")
          if target == "com.v2ray.ang.handler.MmkvManager":
              sys.exit("MmkvManager was not renamed; release obfuscation is not active")
          print("R8 renamed MmkvManager ->", target)
          PYCODE
          echo "Verified APK with the canonical obfuscated Worker: $APK"

      - name: Upload Phantom APK
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-2.4.4-ZEUS-Architecture-Android-armeabi-v7a-Release-Debug-Signed-APK
          path: source/PHANTOM-FINAL-SOURCE/V2rayNG/app/build/outputs/apk/playstore/release/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping (keep private)
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-R8-mapping-KEEP-PRIVATE
          path: source/PHANTOM-FINAL-SOURCE/V2rayNG/app/build/outputs/mapping/playstoreRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14
